# Agent Registry Relay logging config (standard logging.INI).
# Pass via: agent-registry --log-config ./log.conf
# Note: uvicorn routes any non-.json / non-.yaml log_config through
# logging.config.fileConfig, so this must be INI, not JSON.
# Python 3.13+/3.14 fileConfig: 'qualname' per logger is required, and
# 'propagate' is parsed as an int (0/1), not 'no'/'yes'.

[loggers]
keys=root,uvicorn,uvicorn.error,uvicorn.access,a2x_registry

[handlers]
keys=console

[formatters]
keys=default

[logger_root]
level=WARNING
handlers=console
qualname=root

[logger_uvicorn]
level=INFO
handlers=console
propagate=0
qualname=uvicorn

[logger_uvicorn.error]
level=INFO
handlers=console
propagate=0
qualname=uvicorn.error

[logger_uvicorn.access]
level=INFO
handlers=console
propagate=0
qualname=uvicorn.access

# All project modules (a2x_registry.tunnel.server, a2x_registry.tcp_tunnel.server,
# a2x_registry.relay.service, a2x_registry.heartbeat.*, ...) inherit this.
[logger_a2x_registry]
level=INFO
handlers=console
propagate=0
qualname=a2x_registry

[handler_console]
class=StreamHandler
level=INFO
formatter=default
args=(sys.stdout,)

[formatter_default]
format=%(asctime)s %(levelname)s %(name)s: %(message)s
datefmt=%Y-%m-%d %H:%M:%S
