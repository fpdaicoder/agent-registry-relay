[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-registry-client"
dynamic = ["version"]                # read from a2x_registry_client.__version__
description = "Python SDK for agent registration, discovery, auth, heartbeat, and reservations."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Agent Registry maintainers" }]
keywords = ["registry", "agent", "a2a", "sdk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/kwistzzqq-byte/agent-registry-relay/tree/main/client"
Issues = "https://github.com/kwistzzqq-byte/agent-registry-relay/issues"

[project.scripts]
agent-registry-client = "a2x_registry_client.cli:main"
# Compatibility alias retained for existing installations.
a2x-registry-client = "a2x_registry_client.cli:main"

[tool.setuptools]
packages = ["a2x_registry_client"]

[tool.setuptools.dynamic]
version = { attr = "a2x_registry_client.__version__" }

[tool.setuptools.package-data]
a2x_registry_client = ["py.typed"]
