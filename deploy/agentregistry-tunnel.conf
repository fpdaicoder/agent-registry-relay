[Service]
EnvironmentFile=/etc/agent-registry/tunnel.env
Environment="PYTHONNOUSERSITE=1"
Environment="A2X_TUNNEL_ENABLED=true"
Environment="A2X_TUNNEL_AUTO_BIND_REGISTERED_SERVICES=true"
Environment="A2X_TUNNEL_HOST=0.0.0.0"
Environment="A2X_TUNNEL_PORT=8001"
Environment="A2X_TUNNEL_MAX_DEVICES=1000"
Environment="A2X_TUNNEL_MAX_PENDING_REQUESTS=10000"
