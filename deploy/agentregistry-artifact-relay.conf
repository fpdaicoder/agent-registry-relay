[Service]
EnvironmentFile=/etc/agent-registry/artifact-relay.env
Environment="A2X_ARTIFACT_RELAY_ENABLED=true"
Environment="A2X_ARTIFACT_RELAY_PUBLIC_BASE_URL=https://registry.example.com"
Environment="A2X_ARTIFACT_RELAY_STORAGE_DIR=/var/lib/agent-registry/artifact-relay"
Environment="A2X_ARTIFACT_RELAY_MAX_OBJECT_BYTES=268435456"
Environment="A2X_ARTIFACT_RELAY_CHUNK_BYTES=1048576"
Environment="A2X_ARTIFACT_RELAY_DEFAULT_TTL_SECONDS=3600"
Environment="A2X_ARTIFACT_RELAY_MAX_TTL_SECONDS=86400"
Environment="A2X_ARTIFACT_RELAY_CLEANUP_INTERVAL_SECONDS=60"
