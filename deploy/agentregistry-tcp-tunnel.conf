[Service]
EnvironmentFile=/etc/agent-registry/tcp-tunnel.env
Environment="PYTHONNOUSERSITE=1"
Environment="A2X_TCP_TUNNEL_ENABLED=true"
Environment="A2X_TCP_TUNNEL_HOST=0.0.0.0"
Environment="A2X_TCP_TUNNEL_PORT=8003"
Environment="A2X_TCP_TUNNEL_PROXY_HOST=0.0.0.0"
Environment="A2X_TCP_TUNNEL_PORT_RANGE_MIN=10000"
Environment="A2X_TCP_TUNNEL_PORT_RANGE_MAX=11000"
Environment="A2X_TCP_TUNNEL_MAX_DEVICES=1000"
Environment="A2X_TCP_TUNNEL_MAX_CONNECTIONS=10000"
